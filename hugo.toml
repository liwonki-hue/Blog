baseURL = "/"
languageCode = "ko-kr"
title = "My Life Story"
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true

[params]
  env = "production"
  defaultTheme = "light"
  subtitle = "Not bound by routine, I create my own destiny."
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  disableSpecial1stPost = true
  hidemeta = false
  comments = false
  mainSections = ["philosophy", "finance", "life-wisdom", "retirement", "reading"]

  [params.assets]
    theme_color = "#1e1e1e"

